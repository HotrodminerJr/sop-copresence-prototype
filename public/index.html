<!DOCTYPE html>
<html>
<head>
    <title>SOP WebRTC Prototype</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #status { padding: 10px; background: #eee; margin-bottom: 10px; }
        #log { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-top: 10px; }
        button { padding: 10px 20px; margin: 5px; }
        .drift-good { color: #0a0; }
        .drift-warn { color: #a80; }
        .drift-bad  { color: #a00; font-weight: bold; }
        .sync-panel { background: #f4f4f4; padding: 10px; margin: 10px 0; border-left: 4px solid #666; }
    </style>
</head>
<body>
    <h2>SOP Co-Presence Prototype — Phase 2 (Sync Engine)</h2>
    <div id="status">Status: <span id="statusText">Not connected</span></div>
    <div>Role: <span id="roleText">-</span> | RTT: <span id="rttText">-</span> ms | Offset θ: <span id="offsetText">-</span> ms</div>
    <div>Burst: <span id="burstText">-</span></div>

    <div class="sync-panel">
        <div>Local position: <span id="positionText">-</span> ms</div>
        <div>Expected position: <span id="expectedText">-</span> ms
            &nbsp;|&nbsp;
            Drift: <span id="driftText">-</span> ms</div>
        <div>Rate: <span id="rateText">1.00</span>× &nbsp;|&nbsp; Correction: <span id="modeText">—</span></div>
        <div>Video lag (model − video): <span id="videoLagText">—</span> ms</div>
        <div>Rows logged: <span id="rowCountText">0</span></div>
    </div>

    <button id="playBtn" disabled>▶ Play (leader only)</button>
    <button id="injectBtn" disabled>Inject +2000 ms drift</button>
    <button id="downloadBtn" disabled>Download drift CSV</button>
    <button id="clearBtn" disabled>Clear log</button>
    <button id="sendBtn" disabled>Send test message</button>

    <div style="margin-top: 10px;">
        <video id="video" muted playsinline preload="auto" style="width: 480px; display: block; background: #000;"></video>
    </div>

    <div id="log"></div>

    <script src="client.js"></script>
</body>
</html>
